<html lang="en" xmlns:th="http://www.thymeleaf.org"
     th:replace="~{base :: Layout(~{::section})}">
	<head>
		
	</head>
	<body>
		<section>
			<div class="container mt-5">
			    <div class="card shadow">
			        <div class="card-body">

			            <h4 class="text-center mb-4">Product Details</h4>

			            <div class="row align-items-center">

			                <!-- Product Image -->
			                <div class="col-md-5 text-center">
			                    <img src="images/product_img/laptop.jpg"
			                         class="img-fluid"
			                         style="max-height:300px;">
			                </div>

			                <!-- Product Info -->
			                <div class="col-md-7">

			                    <h4 class="mb-3">Mac book Pro</h4>

			                    <p><b>Description :</b> mac book pro 15inch</p>

			                    <p><b>Product Details:</b></p>
			                    <p>Status :
			                        <span class="badge bg-success">Available</span>
			                    </p>
			                    <p>Category : Electronics</p>
			                    <p>Policy : 7 Days Replacement & Return</p>

			                    <h5 class="mt-3">
			                        Price :
			                        <span class="fw-bold text-dark">₹ 47,500</span>
			                        <span class="text-success ms-2">0% off</span>
			                    </h5>

			                    <!-- Icons -->
			                    <div class="row text-center mt-4">
			                        <div class="col">
			                            <i class="fa-solid fa-money-bill text-danger fs-3"></i>
			                            <p class="small">Cash On Delivery</p>
			                        </div>
			                        <div class="col">
			                            <i class="fa-solid fa-rotate-left text-danger fs-3"></i>
			                            <p class="small">Return Available</p>
			                        </div>
			                        <div class="col">
			                            <i class="fa-solid fa-truck text-danger fs-3"></i>
			                            <p class="small">Free Shipping</p>
			                        </div>
			                    </div>

			                    <!-- Button -->
			                    <div class="mt-4">
			                        <a href="#" class="btn btn-danger w-100">
			                            Add To Cart
			                        </a>
			                    </div>

			                </div>
			            </div>

			        </div>
			    </div>
			</div>

		</section>
	</body>
</html>
